<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lighter 中性账户监控</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101317; color: #e8edf2; }
    body { margin: 0; padding: 24px; max-width: 1280px; margin-inline: auto; }
    h1 { margin: 0 0 6px; font-size: 1.45rem; }
    .muted { color: #9aa6b2; font-size: .86rem; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 18px 0; }
    button { border: 1px solid #3b4754; border-radius: 6px; background: #1c2630; color: #edf3f8; padding: 8px 12px; cursor: pointer; }
    button:hover { background: #273544; }
    button.danger { border-color: #b34747; background: #542528; }
    button:disabled { opacity: .5; cursor: wait; }
    input { width: 100px; border: 1px solid #3b4754; border-radius: 5px; background: #11181f; color: inherit; padding: 7px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .panel { border: 1px solid #2d3945; border-radius: 8px; padding: 14px; background: #151c23; }
    .panel h2 { margin: 0 0 10px; font-size: 1rem; }
    .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .metric { background: #11181f; border-radius: 5px; padding: 8px; }
    .metric b { display: block; margin-top: 3px; overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { text-align: left; border-bottom: 1px solid #29333d; padding: 9px 6px; vertical-align: middle; }
    th { color: #9aa6b2; font-size: .78rem; font-weight: 600; }
    .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .status { min-height: 1.3em; color: #9aa6b2; }
    .status.error { color: #ff9b9b; }
    .status.ok { color: #86e1ab; }
    @media (max-width: 700px) { body { padding: 14px; } th:nth-child(4), td:nth-child(4), th:nth-child(5), td:nth-child(5) { display: none; } }
  </style>
</head>
<body>
  <h1>Lighter 中性账户监控</h1>
  <div class="muted">监控主账户与子账户的 SPY/QQQ 四腿仓位。所有平仓操作都是只减仓，并由后端重新校验。双腿和全部平仓分别提交，请逐项确认结果。</div>
  <div class="toolbar">
    <button id="refresh" type="button">刷新</button>
    <button id="rebalance" type="button">平衡可用保证金</button>
    <button id="flatten" class="danger" type="button">平仓全部四条腿</button>
    <span id="status" class="status" role="status"></span>
  </div>
  <section id="accounts" class="grid" aria-live="polite"></section>
  <section class="panel" style="margin-top:14px">
    <h2>风险与余额平衡</h2>
    <div id="risk" class="metrics" aria-live="polite"></div>
  </section>
  <section class="panel" style="margin-top:14px">
    <h2>账户仓位与部分平仓</h2>
    <div class="muted">输入要平的绝对数量；留空则平掉该仓位。平仓方向由服务器根据当前仓位自动决定。</div>
    <table>
      <thead><tr><th>账户</th><th>标的</th><th>仓位</th><th>名义价值</th><th>方向</th><th>操作</th></tr></thead>
      <tbody id="positions"></tbody>
    </table>
  </section>
  <section class="panel" style="margin-top:14px">
    <h2>同时平掉某个标的的两条腿</h2>
    <div id="pairs" class="actions"></div>
  </section>

  <script>
    const accountsEl = document.getElementById('accounts');
    const riskEl = document.getElementById('risk');
    const positionsEl = document.getElementById('positions');
    const pairsEl = document.getElementById('pairs');
    const statusEl = document.getElementById('status');
    const refreshBtn = document.getElementById('refresh');
    const rebalanceBtn = document.getElementById('rebalance');
    const flattenBtn = document.getElementById('flatten');

    function id() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
      return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
    }
    function text(value) {
      if (value === null || value === undefined || value === '') return '-';
      return String(value);
    }
    function accountText(value) {
      const name = String(value || '').toLowerCase();
      return name === 'main' ? '主账户' : name === 'sub' ? '子账户' : text(value);
    }
    function sideText(value) {
      const side = String(value || '').toLowerCase();
      return side === 'long' ? '多' : side === 'short' ? '空' : side === 'flat' ? '空仓' : text(value);
    }
    function setStatus(message, error) {
      statusEl.textContent = message || '';
      statusEl.className = 'status' + (error ? ' error' : message ? ' ok' : '');
    }
    function number(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n.toLocaleString(undefined, { maximumFractionDigits: 8 }) : text(value);
    }
    function metric(label, value) {
      const box = document.createElement('div');
      box.className = 'metric';
      const small = document.createElement('span');
      small.className = 'muted';
      small.textContent = label;
      const strong = document.createElement('b');
      strong.textContent = number(value);
      box.append(small, strong);
      return box;
    }
    function normaliseAccounts(data) {
      const raw = data && data.accounts;
      const entries = raw && !Array.isArray(raw)
        ? Object.entries(raw).map(([name, value]) => ({ name, ...(value || {}) }))
        : Array.isArray(raw) ? raw : [];
      const byName = new Map(entries.map(account => [String(account.name || account.account || '').toLowerCase(), account]));
      // Always render both configured accounts. A missing/stale sub snapshot
      // must be visible instead of silently removing the subaccount card.
      return ['main', 'sub'].map(name => byName.get(name) || {
        name,
        error: '尚未读取到账户数据',
        available_balance: null,
        equity: null,
        maintenance_margin_requirement: null,
        maintenance_ratio: null,
        initial_ratio: null,
        positions: [],
      });
    }
    function normalisePositions(data, accounts) {
      if (Array.isArray(data && data.legs)) return data.legs;
      if (Array.isArray(data && data.positions)) return data.positions;
      const result = [];
      accounts.forEach(account => (account.positions || []).forEach(position => result.push({ account: account.name || account.account, ...position })));
      return result;
    }
    function render(data) {
      // Polling rebuilds the tables. Preserve operator-entered quantities so
      // a refresh cannot overwrite an input while it is being edited.
      const positionInputValues = new Map();
      positionsEl.querySelectorAll('input[data-position-key]').forEach(input => {
        positionInputValues.set(input.dataset.positionKey, input.value);
      });
      const pairInputValues = new Map();
      pairsEl.querySelectorAll('input[data-pair-symbol]').forEach(input => {
        pairInputValues.set(input.dataset.pairSymbol, input.value);
      });
      const accounts = normaliseAccounts(data);
      accountsEl.replaceChildren();
      accounts.forEach(account => {
        const panel = document.createElement('article');
        panel.className = 'panel';
        const title = document.createElement('h2');
        const accountName = String(account.name || account.account || '').toLowerCase();
        title.textContent = accountText(accountName);
        const metrics = document.createElement('div');
        metrics.className = 'metrics';
        metrics.append(
          metric('账户索引', account.account_index ?? account.accountIndex),
          metric('可用保证金', account.available_balance ?? account.availableBalance),
          metric('账户权益', account.equity ?? account.total_asset_value ?? account.totalAccountValue),
          metric('维护保证金', account.maintenance_margin_requirement ?? account.maintenanceMargin),
          metric('维护保证金率', account.maintenance_ratio ?? account.margin_ratio ?? account.marginRatio),
          metric('初始保证金率', account.initial_ratio ?? account.initialRatio)
        );
        if (account.error) {
          const error = document.createElement('div');
          error.className = 'status error';
          error.textContent = '读取失败：' + account.error;
          panel.append(error);
        }
        panel.append(title, metrics);
        accountsEl.append(panel);
      });

      riskEl.replaceChildren();
      const aggregate = data.aggregate || {};
      const plan = data.transfer_plan;
      riskEl.append(
        metric('可用保证金净差值（主账户 - 子账户）', aggregate.available_balance_delta),
        metric('SPY 净仓位', aggregate.net_spy),
        metric('QQQ 净仓位', aggregate.net_qqq),
        metric('SPY 净名义价值', aggregate.net_spy_value),
        metric('QQQ 净名义价值', aggregate.net_qqq_value),
        metric('维护保证金率差', aggregate.margin_ratio_delta),
        metric('未实现盈亏', aggregate.unrealized_pnl),
        metric('已实现盈亏', aggregate.realized_pnl),
        metric('转账计划', plan ? `${plan.source === 'main' ? '主账户' : '子账户'} -> ${plan.destination === 'main' ? '主账户' : '子账户'}：${plan.amount}` : '无')
      );
      if (data.pair_error) {
        const warning = document.createElement('div');
        warning.className = 'status error';
        warning.textContent = '账户安全校验：' + data.pair_error;
        riskEl.append(warning);
      }
      if (data.transfer_block_reason) {
        const note = document.createElement('div');
        note.className = 'status';
        note.textContent = data.transfer_block_reason;
        riskEl.append(note);
      }

      const positions = normalisePositions(data, accounts);
      positionsEl.replaceChildren();
      const symbols = new Set();
      positions.forEach(position => {
        const accountKey = String(position.account || position.account_name || '').toLowerCase();
        const account = accountText(accountKey);
        const symbol = text(position.symbol || position.ticker);
        const size = position.signed_size ?? position.size ?? position.position ?? position.quantity;
        if (symbol !== '-') symbols.add(symbol.toUpperCase());
        const row = document.createElement('tr');
        [account, symbol, number(size), number(position.position_value ?? position.margin ?? position.allocated_margin),
          `${sideText(position.actual_side)} / ${sideText(position.expected_side)}`].forEach(value => {
          const cell = document.createElement('td');
          cell.textContent = value;
          row.append(cell);
        });
        const actionCell = document.createElement('td');
        const actions = document.createElement('div');
        actions.className = 'actions';
        const quantity = document.createElement('input');
        quantity.type = 'text';
        quantity.inputMode = 'decimal';
        const positionKey = accountKey + '|' + symbol.toUpperCase();
        quantity.dataset.positionKey = positionKey;
        quantity.value = positionInputValues.has(positionKey)
          ? positionInputValues.get(positionKey)
          : (size && Number(size) !== 0 ? String(Math.abs(Number(size))) : '');
        quantity.setAttribute('aria-label', '平仓数量');
        const close = document.createElement('button');
        close.type = 'button';
        close.textContent = '平仓';
        close.disabled = account === '-' || symbol === '-' || !size || Number(size) === 0;
        close.addEventListener('click', () => closePosition(account, symbol, quantity.value, close));
        actions.append(quantity, close);
        actionCell.append(actions);
        row.append(actionCell);
        positionsEl.append(row);
      });

      pairsEl.replaceChildren();
      [...symbols].sort().forEach(symbol => {
        const quantity = document.createElement('input');
        quantity.type = 'text';
        quantity.inputMode = 'decimal';
        quantity.dataset.pairSymbol = symbol.toUpperCase();
        if (pairInputValues.has(symbol.toUpperCase())) {
          quantity.value = pairInputValues.get(symbol.toUpperCase());
        }
        quantity.placeholder = '数量（留空为全部）';
        quantity.setAttribute('aria-label', symbol + ' 双腿平仓数量');
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = '同时平 ' + symbol + ' 两腿';
        button.addEventListener('click', () => closePair(symbol, quantity.value, button));
        pairsEl.append(quantity, button);
      });
    }
    async function load() {
      try {
        const response = await fetch('/api/snapshot', { cache: 'no-store' });
        if (!response.ok) throw new Error('snapshot HTTP ' + response.status);
        render(await response.json());
        setStatus('已更新：' + new Date().toLocaleTimeString(), false);
      } catch (error) { setStatus(String(error.message || error), true); }
    }
    async function action(path, body, button) {
      if (button) button.disabled = true;
      try {
        const response = await fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Neutral-Action': 'dashboard' },
          body: JSON.stringify({ ...body, request_id: id() })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.ok === false) throw new Error(payload.error || 'action HTTP ' + response.status);
        setStatus('操作已提交', false);
        await load();
      } catch (error) { setStatus(String(error.message || error), true); }
      finally { if (button) button.disabled = false; }
    }
    function closePosition(account, symbol, quantity, button) {
      const amountText = quantity ? ('数量 ' + quantity) : '全部仓位';
      if (!window.confirm('二次确认：确定平仓 ' + accountText(account) + ' 的 ' + symbol + '（' + amountText + '）吗？')) return;
      if (quantity && Number(quantity) <= 0) { setStatus('请输入正数，或留空表示全部平仓', true); return; }
      const body = { account, symbol };
      if (quantity) body.quantity = quantity;
      action('/api/actions/close-position', body, button);
    }
    function closePair(symbol, quantity, button) {
      if (quantity && Number(quantity) <= 0) { setStatus('请输入正数，或留空表示全部平仓', true); return; }
      const body = { symbol };
      if (quantity) body.quantity = quantity;
      if (window.confirm('确定同时平掉 ' + symbol + ' 的主账户和子账户仓位吗？')) action('/api/actions/close-pair', body, button);
    }
    refreshBtn.addEventListener('click', load);
    rebalanceBtn.addEventListener('click', () => {
      if (window.confirm('重新计算可用保证金平衡转账计划，并仅在后端允许时执行？')) {
        action('/api/actions/rebalance', {}, rebalanceBtn);
      }
    });
    flattenBtn.addEventListener('click', () => {
      if (window.confirm('这会平掉配置中的全部四条腿，确定继续吗？')) {
        action('/api/actions/flatten-all', { confirm: 'FLATTEN_ALL' }, flattenBtn);
      }
    });
    load();
    window.setInterval(load, 2000);
  </script>
</body>
</html>
